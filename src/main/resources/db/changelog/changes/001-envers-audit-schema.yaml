databaseChangeLog:
  - changeSet:
      id: 001-create-envers-revinfo-schema
      author: Wilie12
      changes:
        - createSequence:
            sequenceName: revinfo_seq
            startValue: 1
            incrementBy: 50
        - createTable:
            tableName: revinfo
            columns:
              - column:
                  name: rev
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_revinfo
              - column:
                  name: revtstmp
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: UUID
                  constraints:
                    nullable: true