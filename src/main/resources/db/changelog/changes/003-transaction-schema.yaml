databaseChangeLog:
  - changeSet:
      id: 003-create-transaction-number-sequence
      author: Wilie12
      changes:
        - createSequence:
            sequenceName: transaction_number_seq
            startValue: 1
            incrementBy: 1

  - changeSet:
      id: 003-create-transactions-table
      author: Wilie12
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transactions
              - column:
                  name: reference_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_transactions_reference_number
              - column:
                  name: idempotency_key
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_transactions_idempotency_key
              - column:
                  name: sender_wallet_id
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: recipient_wallet_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: sender_wallet_id
            constraintName: fk_transactions_sender_wallet
            referencedTableName: wallets
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: recipient_wallet_id
            constraintName: fk_transactions_recipient_wallet
            referencedTableName: wallets
            referencedColumnNames: id
        - createIndex:
            indexName: idx_transactions_sender_wallet_id
            tableName: transactions
            columns:
              - column:
                  name: sender_wallet_id
        - createIndex:
            indexName: idx_transactions_recipient_wallet_id
            tableName: transactions
            columns:
              - column:
                  name: recipient_wallet_id
        - createIndex:
            indexName: idx_transactions_created_at
            tableName: transactions
            columns:
              - column:
                  name: created_at