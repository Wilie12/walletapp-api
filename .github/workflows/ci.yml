name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    env:
      MAVEN_OPTS: "-Xmx1024m -XX:MaxMetaspaceSize=512m"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x ./mvnw

      - name: Verify build and execute test suites
        run: ./mvnw clean verify -B -ntp
