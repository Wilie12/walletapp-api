services:
  postgres:
    image: postgres:16-alpine
    container_name: walletapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-walletapp_db}
      POSTGRES_USER: ${POSTGRES_USER:-wallet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_secret_password}
    networks:
      - backend-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallet_user} -d ${POSTGRES_DB:-walletapp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: walletapp-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_secret_password}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./src/test/resources/keycloak/keycloak-realm-test.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - keycloak-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 10

  walletapp-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: walletapp-api:latest
    container_name: walletapp-api
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-walletapp_db}
      POSTGRES_USER: ${POSTGRES_USER:-wallet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_secret_password}
      JWKS_ISSUER_URI: ${JWKS_ISSUER_URI:-http://keycloak:8080/realms/walletapp-realm}
      APP_SECURITY_RATE_LIMIT_ENABLED: ${APP_SECURITY_RATE_LIMIT_ENABLED:-true}
      APP_SECURITY_RATE_LIMIT_CAPACITY: ${APP_SECURITY_RATE_LIMIT_CAPACITY:-10}
      APP_SECURITY_RATE_LIMIT_REFILL_TOKENS: ${APP_SECURITY_RATE_LIMIT_REFILL_TOKENS:-10}
      APP_SECURITY_RATE_LIMIT_REFILL_DURATION_SECONDS: ${APP_SECURITY_RATE_LIMIT_REFILL_DURATION_SECONDS:-60}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - backend-internal
      - keycloak-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

networks:
  backend-internal:
    internal: true
    driver: bridge
  keycloak-net:
    driver: bridge